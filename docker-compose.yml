version: "3.9"

services:
  api:
    build: .
    container_name: agrischeme-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/agrischeme
      JWT_SECRET: change-me-to-a-long-random-secret
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: agrischeme-db
    environment:
      POSTGRES_DB: agrischeme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
